name: Smart Factory ETL Pipeline

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread gspread-dataframe
          pip install pandas numpy gspread gspread-dataframe tenacity

      - name: Ejecutar script ETL
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python etl_produccion_oee.py
