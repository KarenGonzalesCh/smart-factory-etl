name: Smart Factory ETL Pipeline

on:
  schedule:
    - cron: '30 4 * * 0-5'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread gspread-dataframe tenacity

      - name: Ejecutar script ETL con reintentos
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 35        # Ampliado a 35 min para dar margen a las esperas de 10 min
          max_attempts: 3           # Intento inicial + 2 reintentos
          retry_wait_seconds: 600   # 10 minutos de pausa exacta entre fallos
          command: python etl_produccion_oee.py
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}