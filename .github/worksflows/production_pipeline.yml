name: Smart Factory ETL Pipeline

on:
  schedule:
    # Se ejecuta automáticamente de lunes a viernes a las 18:00 UTC
    - cron: '0 18 * * 1-5'
  workflow_dispatch: # Permite lanzarlo manualmente con un botón desde GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread gspread-dataframe

      - name: Configurar credenciales de Google Service Account
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          # Recrea la ruta exacta que busca tu script en el servidor virtual de GitHub
          mkdir -p "/content/drive/MyDrive/INFORME PRODUCCIÓN/Planillas/"
          echo "$GOOGLE_CREDENTIALS_JSON" > "/content/drive/MyDrive/INFORME PRODUCCIÓN/Planillas/proyecto-prueba-429201-10470bb8bb00.json"

      - name: Ejecutar script ETL
        run: |
          python etl_produccion_oee.py